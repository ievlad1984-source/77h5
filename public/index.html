<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iDroo Clone - Math Board</title>
    <script defer src="https://cdn.jsdelivr.net/npm/mathlive"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --panel-bg: #ffffff;
            --border-color: #e0e0e0;
            --accent-color: #007bff;
            --handle-color: #7CFC00; /* Лаймовый для ручек iDroo */
            --rotate-color: #2196F3;
            --text-main: #333;
        }

        body, html { 
            margin: 0; padding: 0; overflow: hidden; height: 100%; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-color); 
        }

        /* --- ВЕРХНЯЯ ПАНЕЛЬ (HEADER) --- */
        #app-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            user-select: none;
        }

        .toolbar-main {
            display: flex;
            align-items: center;
            padding: 5px 10px;
            gap: 5px;
            height: 45px;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 0 8px;
            border-right: 1px solid var(--border-color);
        }

        .tool-btn {
            height: 32px;
            min-width: 32px;
            padding: 0 8px;
            cursor: pointer;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 4px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }

        .tool-btn:hover { background: #f0f0f0; }
        .tool-btn.active { 
            background: #e8f0fe; 
            color: var(--accent-color); 
            border-color: #c2d7ff; 
        }

        /* --- ПАНЕЛЬ ФОРМУЛ (FORMULA BAR) --- */
        #formula-bar {
            display: none; /* Скрыта по умолчанию */
            background: #f9f9f9;
            border-bottom: 1px solid var(--border-color);
            padding: 8px 15px;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .formula-section {
            display: flex;
            gap: 4px;
            align-items: center;
            padding-right: 15px;
            border-right: 1px solid #ddd;
        }

        .formula-btn {
            padding: 4px 8px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Cambria Math', serif;
            font-size: 15px;
        }

        .formula-btn:hover { background: #eee; }

        /* --- НАСТРОЙКИ (ЦВЕТ, ТЕКСТ) --- */
        .property-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
            padding-right: 15px;
        }

        .color-dot {
            width: 20px; height: 20px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 0 1px #ccc;
            cursor: pointer;
        }

        /* --- КАНВАС И ЭЛЕМЕНТЫ --- */
        canvas { display: block; touch-action: none; }

        .text-edit-wrapper {
            position: absolute;
            z-index: 2000;
            border: 1px solid var(--handle-color);
            background: transparent;
            padding: 2px;
        }

        .text-edit-content {
            outline: none;
            background: white;
            font-family: 'Segoe UI', sans-serif;
            min-width: 50px;
        }

        /* Ручки выделения как в iDroo */
        .handle {
            position: absolute;
            width: 8px; height: 8px;
            background: var(--handle-color);
            border: 1px solid white;
            border-radius: 1px;
            cursor: pointer;
        }
        .handle.nw { top: -4px; left: -4px; cursor: nw-resize; }
        .handle.n  { top: -4px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
        .handle.ne { top: -4px; right: -4px; cursor: ne-resize; }
        .handle.e  { top: 50%; right: -4px; transform: translateY(-50%); cursor: ew-resize; }
        .handle.se { bottom: -4px; right: -4px; cursor: se-resize; }
        .handle.s  { bottom: -4px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
        .handle.sw { bottom: -4px; left: -4px; cursor: sw-resize; }
        .handle.w  { top: 50%; left: -4px; transform: translateY(-50%); cursor: ew-resize; }
        
        .rotate-handle {
            position: absolute;
            top: -20px; left: 50%;
            transform: translateX(-50%);
            width: 10px; height: 10px;
            background: var(--rotate-color);
            border: 2px solid white;
            border-radius: 50%;
            cursor: alias;
        }

        #zoom-display {
            position: absolute; bottom: 20px; right: 20px;
            background: white; padding: 5px 12px;
            border-radius: 15px; border: 1px solid #ddd;
            font-size: 12px; z-index: 1000;
        }

        input[type="color"] { display: none; }
    </style>
</head>
<body>

<div id="app-header">
    <div class="toolbar-main">
        <div class="tool-group">
            <button class="tool-btn active" data-tool="select" title="Выбрать (V)">↖️</button>
            <button class="tool-btn" data-tool="hand" title="Рука (H)">✋</button>
        </div>
        
        <div class="tool-group">
            <button class="tool-btn" data-tool="pen" title="Карандаш">✏️</button>
            <button class="tool-btn" data-tool="line" title="Линия">╱</button>
            <button class="tool-btn" data-tool="rect" title="Фигуры">⬜</button>
            <button class="tool-btn" data-tool="grid" title="Сетка">📊</button>
            <button class="tool-btn" data-tool="text" title="Текст">T</button>
        </div>

        <div class="tool-group">
            <button class="tool-btn" id="fxBtn" title="Формулы">fx</button>
            <button class="tool-btn" data-tool="eraser" title="Ластик">🧹</button>
        </div>

        <div class="property-group">
            <div class="color-dot" id="colorPreview" style="background: #000000;"></div>
            <input type="color" id="colorPicker">
            <input type="range" id="lineWidth" min="1" max="20" value="3" style="width: 80px;">
            <label style="font-size: 12px; cursor: pointer;"><input type="checkbox" id="boldText"> <b>B</b></label>
            <button class="tool-btn" id="clearBtn" style="color: red; font-size: 12px; border: 1px solid #ffcccc;">Очистить</button>
        </div>
    </div>

    <!-- Горизонтальная панель формул как в iDroo -->
    <div id="formula-bar">
        <div class="formula-section">
            <span style="color: #888; margin-right: 5px;">База:</span>
            <button class="formula-btn" onclick="insertMathSymbol('\\frac{}{}')">$\frac{a}{b}$</button>
            <button class="formula-btn" onclick="insertMathSymbol('^{}')">$x^n$</button>
            <button class="formula-btn" onclick="insertMathSymbol('_{}')">$x_n$</button>
            <button class="formula-btn" onclick="insertMathSymbol('\\sqrt{} endemic')">$\sqrt{x}$</button>
            <button class="formula-btn" onclick="insertMathSymbol('\\pm')">±</button>
            <button class="formula-btn" onclick="insertMathSymbol('\\approx')">≈</button>
        </div>
        <div class="formula-section">
            <span style="color: #888; margin-right: 5px;">Греч:</span>
            <button class="formula-btn" onclick="insertMathSymbol('\\alpha')">α</button>
            <button class="formula-btn" onclick="insertMathSymbol('\\beta')">β</button>
            <button class="formula-btn" onclick="insertMathSymbol('\\gamma')">γ</button>
            <button class="formula-btn" onclick="insertMathSymbol('\\pi')">π</button>
            <button class="formula-btn" onclick="insertMathSymbol('\\theta')">θ</button>
        </div>
        <div class="formula-section">
            <span style="color: #888; margin-right: 5px;">Исчисление:</span>
            <button class="formula-btn" onclick="insertMathSymbol('\\sum_{}^{}')">$\sum$</button>
            <button class="formula-btn" onclick="insertMathSymbol('\\int_{}^{}')">$\int$</button>
            <button class="formula-btn" onclick="insertMathSymbol('\\lim_{}')">$\lim$</button>
        </div>
        <div style="margin-left: auto; color: #aaa; font-size: 11px;">MathLive Engine</div>
    </div>
</div>

<div id="zoom-display">100%</div>
<canvas id="board"></canvas>

<script>
    // ===========================================================================
    // ЯДРО ПРИЛОЖЕНИЯ (Логика перенесена и адаптирована из вашего кода)
    // ===========================================================================
    
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    let scale = 1.0, offsetX = 0, offsetY = 0;
    let objects = {}; 
    let objectsArray = [];
    let currentTool = 'select';
    let selectedObjects = [];
    let isDragging = false, isResizing = false, isRotating = false;
    let resizeHandle = null;
    let isDrawing = false, currentPath = null;
    let dragStartX, dragStartY;
    let textEditor = null, editingObject = null;
    const latexCache = {};

    // Инициализация размера
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        requestDraw();
    }
    window.addEventListener('resize', resize);
    resize();

    // ===========================================================================
    // UI УПРАВЛЕНИЕ
    // ===========================================================================
    
    // Переключение инструментов
    document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
        btn.onclick = () => {
            currentTool = btn.dataset.tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedObjects = [];
            requestDraw();
        };
    });

    // Показ/скрытие панели формул
    const fxBtn = document.getElementById('fxBtn');
    const formulaBar = document.getElementById('formula-bar');
    fxBtn.onclick = () => {
        const isVisible = formulaBar.style.display === 'flex';
        formulaBar.style.display = isVisible ? 'none' : 'flex';
        fxBtn.classList.toggle('active');
    };

    // Цвет
    const colorPicker = document.getElementById('colorPicker');
    const colorPreview = document.getElementById('colorPreview');
    colorPreview.onclick = () => colorPicker.click();
    colorPicker.oninput = (e) => {
        colorPreview.style.background = e.target.value;
    };

    // Очистка
    document.getElementById('clearBtn').onclick = () => {
        if(confirm("Очистить всё?")) {
            objects = {}; objectsArray = []; selectedObjects = [];
            requestDraw();
        }
    };

    // ===========================================================================
    // МАТЕМАТИКА (MATHLIVE & KATEX)
    // ===========================================================================

    function insertMathSymbol(latex) {
        const mf = document.querySelector('math-field');
        if (mf) {
            mf.insert(latex);
            mf.focus();
        }
    }

    async function getLatexImage(latex, color, size) {
        const cacheKey = `${latex}_${color}_${size}`;
        if (latexCache[cacheKey]) return latexCache[cacheKey];

        return new Promise((resolve) => {
            const div = document.createElement('div');
            div.style.position = 'absolute';
            div.style.left = '-9999px';
            div.style.color = color;
            div.style.fontSize = `${size}px`;
            document.body.appendChild(div);

            try {
                katex.render(latex, div, { throwOnError: false, displayMode: false });
                const svg = div.querySelector('svg');
                if (!svg) { document.body.removeChild(div); resolve(null); return; }
                
                const svgData = new XMLSerializer().serializeToString(svg);
                const url = URL.createObjectURL(new Blob([svgData], {type: 'image/svg+xml'}));
                const img = new Image();
                img.src = url;
                img.onload = () => {
                    latexCache[cacheKey] = img;
                    document.body.removeChild(div);
                    resolve(img);
                };
            } catch (e) { resolve(null); }
        });
    }

    // ===========================================================================
    // РИСОВАНИЕ И ОБЪЕКТЫ
    // ===========================================================================

    function requestDraw() {
        requestAnimationFrame(draw);
    }

    function draw() {
        ctx.fillStyle = '#fcfcfc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Рисуем легкую сетку фона (как в iDroo)
        drawBackgroundGrid();

        objectsArray.forEach(obj => drawObject(obj));
        if (isDrawing && currentPath) drawObject(currentPath);
        if (selectedObjects.length > 0 && currentTool === 'select') drawSelection();
    }

    function drawBackgroundGrid() {
        const step = 30 * scale;
        ctx.beginPath();
        ctx.strokeStyle = '#eee';
        ctx.lineWidth = 1;
        for (let x = offsetX % step; x < canvas.width; x += step) {
            ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
        }
        for (let y = offsetY % step; y < canvas.height; y += step) {
            ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
        }
        ctx.stroke();
    }

    function drawObject(obj) {
        ctx.save();
        const sx = obj.x * scale + offsetX;
        const sy = obj.y * scale + offsetY;
        ctx.strokeStyle = obj.color || '#000';
        ctx.fillStyle = obj.color || '#000';
        ctx.lineWidth = (obj.width || 2) * scale;

        if (obj.type === 'text') {
            const size = obj.size * scale;
            if (obj.text && (obj.text.includes('\\') || obj.text.includes('{'))) {
                const img = latexCache[`${obj.text}_${obj.color || '#000'}_${size}`];
                if (img) ctx.drawImage(img, sx, sy);
                else getLatexImage(obj.text, obj.color || '#000', size).then(requestDraw);
            } else {
                ctx.font = `${obj.isBold ? 'bold' : ''} ${size}px Segoe UI`;
                ctx.fillText(obj.text || '', sx, sy + size);
            }
        } else if (obj.type === 'pen') {
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            (obj.points || []).forEach(p => ctx.lineTo(p.x * scale + offsetX, p.y * scale + offsetY));
            ctx.stroke();
        } else if (obj.type === 'rect') {
            ctx.strokeRect(sx, sy, obj.w * scale, obj.h * scale);
        } else if (obj.type === 'line') {
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(obj.ex * scale + offsetX, obj.ey * scale + offsetY);
            ctx.stroke();
        } else if (obj.type === 'grid') {
            drawCoordGrid(obj);
        }
        ctx.restore();
    }

    function drawCoordGrid(obj) {
        const sx = obj.x * scale + offsetX;
        const sy = obj.y * scale + offsetY;
        const sw = obj.w * scale;
        const sh = obj.h * scale;
        ctx.fillStyle = "white";
        ctx.fillRect(sx, sy, sw, sh);
        ctx.strokeStyle = "#ccc";
        ctx.strokeRect(sx, sy, sw, sh);
        ctx.beginPath();
        ctx.moveTo(sx + sw/2, sy); ctx.lineTo(sx + sw/2, sy + sh);
        ctx.moveTo(sx, sy + sh/2); ctx.lineTo(sx + sw, sy + sh/2);
        ctx.strokeStyle = "black";
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function drawSelection() {
        const bbox = getGroupBBox(selectedObjects);
        if (!bbox) return;
        const sx = bbox.x * scale + offsetX;
        const sy = bbox.y * scale + offsetY;
        const sw = bbox.w * scale;
        const sh = bbox.h * scale;

        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = '#4CAF50';
        ctx.strokeRect(sx, sy, sw, sh);
        ctx.setLineDash([]);

        // Зеленые квадратики-ручки
        ctx.fillStyle = '#7CFC00';
        const handles = [
            [sx, sy], [sx+sw/2, sy], [sx+sw, sy],
            [sx+sw, sy+sh/2], [sx+sw, sy+sh], [sx+sw/2, sy+sh],
            [sx, sy+sh], [sx, sy+sh/2]
        ];
        handles.forEach(h => ctx.fillRect(h[0]-4, h[1]-4, 8, 8));

        // Синяя точка вращения
        ctx.fillStyle = '#2196F3';
        ctx.beginPath();
        ctx.arc(sx + sw/2, sy - 15, 5, 0, Math.PI*2);
        ctx.fill();
    }

    function getGroupBBox(objs) {
        if (!objs.length) return null;
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        objs.forEach(obj => {
            const b = getBBox(obj);
            minX = Math.min(minX, b.x); minY = Math.min(minY, b.y);
            maxX = Math.max(maxX, b.x + b.w); maxY = Math.max(maxY, b.y + b.h);
        });
        return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    }

    function getBBox(obj) {
        if (obj.type === 'text') return { x: obj.x, y: obj.y, w: obj.size * 5, h: obj.size * 1.5 };
        if (obj.type === 'rect' || obj.type === 'grid') return { x: obj.x, y: obj.y, w: obj.w, h: obj.h };
        if (obj.type === 'line') return { x: Math.min(obj.x, obj.ex), y: Math.min(obj.y, obj.ey), w: Math.abs(obj.ex - obj.x), h: Math.abs(obj.ey - obj.y) };
        if (obj.type === 'pen') return { x: obj.x, y: obj.y, w: 50, h: 50 };
        return { x: obj.x, y: obj.y, w: 10, h: 10 };
    }

    // ===========================================================================
    // СОБЫТИЯ МЫШИ
    // ===========================================================================

    canvas.onmousedown = (e) => {
        const x = (e.clientX - offsetX) / scale;
        const y = (e.clientY - offsetY) / scale;

        if (currentTool === 'select') {
            const hit = [...objectsArray].reverse().find(o => {
                const b = getBBox(o);
                return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
            });
            if (hit) {
                if (!e.shiftKey) selectedObjects = [];
                selectedObjects.push(hit);
                isDragging = true;
                dragStartX = x; dragStartY = y;
            } else {
                selectedObjects = [];
            }
        } else if (currentTool === 'text') {
            createNewText(x, y);
        } else {
            startDrawing(x, y);
        }
        requestDraw();
    };

    canvas.onmousemove = (e) => {
        const x = (e.clientX - offsetX) / scale;
        const y = (e.clientY - offsetY) / scale;

        if (isDragging && selectedObjects.length > 0) {
            const dx = x - dragStartX;
            const dy = y - dragStartY;
            selectedObjects.forEach(o => {
                o.x += dx; o.y += dy;
                if (o.ex !== undefined) o.ex += dx;
                if (o.ey !== undefined) o.ey += dy;
            });
            dragStartX = x; dragStartY = y;
            requestDraw();
        } else if (isDrawing && currentPath) {
            if (currentPath.type === 'pen') {
                currentPath.points.push({x, y});
            } else if (currentPath.type === 'rect' || currentPath.type === 'grid') {
                currentPath.w = x - currentPath.x;
                currentPath.h = y - currentPath.y;
            } else {
                currentPath.ex = x; currentPath.ey = y;
            }
            requestDraw();
        }
    };

    canvas.onmouseup = () => {
        if (isDrawing && currentPath) {
            const id = 'obj_' + Date.now();
            currentPath.id = id;
            objects[id] = currentPath;
            objectsArray.push(currentPath);
        }
        isDragging = false; isDrawing = false; currentPath = null;
        requestDraw();
    };

    function startDrawing(x, y) {
        isDrawing = true;
        currentPath = {
            type: currentTool,
            x, y, ex: x, ey: y, w: 0, h: 0,
            color: colorPicker.value,
            width: document.getElementById('lineWidth').value,
            points: []
        };
        if (currentTool === 'grid') currentPath.w = 200, currentPath.h = 200;
    }

    function createNewText(x, y) {
        const obj = {
            type: 'text',
            id: 'txt_' + Date.now(),
            x, y, text: '',
            color: colorPicker.value,
            size: 20,
            isBold: document.getElementById('boldText').checked
        };
        objectsArray.push(obj);
        startTextEdit(obj);
    }

    function startTextEdit(obj) {
        if (textEditor) document.body.removeChild(textEditor);
        
        const wrapper = document.createElement('div');
        wrapper.className = 'text-edit-wrapper';
        wrapper.style.left = (obj.x * scale + offsetX) + 'px';
        wrapper.style.top = (obj.y * scale + offsetY) + 'px';

        const mf = document.createElement('math-field');
        mf.className = 'text-edit-content';
        mf.style.fontSize = (obj.size * scale) + 'px';
        mf.style.color = obj.color;
        mf.value = obj.text;

        mf.oninput = () => {
            obj.text = mf.value;
            requestDraw();
        };

        mf.onblur = () => {
            document.body.removeChild(wrapper);
            textEditor = null;
        };

        wrapper.appendChild(mf);
        document.body.appendChild(wrapper);
        textEditor = wrapper;
        setTimeout(() => mf.focus(), 10);
    }

    // Масштабирование
    canvas.onwheel = (e) => {
        e.preventDefault();
        const zoom = e.deltaY > 0 ? 0.9 : 1.1;
        scale *= zoom;
        scale = Math.min(Math.max(scale, 0.1), 10);
        document.getElementById('zoom-display').innerText = Math.round(scale * 100) + '%';
        requestDraw();
    };

</script>
</body>
</html>
